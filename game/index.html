<style>
  html, body { margin: 0; padding: 0; background: #120c26; }

    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #ffe9b8; min-height: 100vh;

<h1>🔎 Twin Lanterns — Spot the Difference</h1>

<div class="keys"><b>Click</b> mark a difference &nbsp;·&nbsp; <b>H</b> hint &nbsp;·&nbsp; <b>R</b> restart level &nbsp;·&nbsp; <b>M</b> menu &nbsp;·&nbsp; <b>Enter</b> continue &nbsp;·&nbsp; <b>1–3</b> choose a level</div>
